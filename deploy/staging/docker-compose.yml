services:
  managed-ai:
    build:
      context: ../../server/managed-ai
    container_name: praxis-managed-ai
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${MANAGED_AI_PORT:-8787}
      PRAXIS_AI_SHARED_TOKEN: ${MANAGED_AI_SHARED_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-30000}
    ports:
      - "${MANAGED_AI_PORT:-8787}:8787"

  web:
    image: nginx:1.27-alpine
    container_name: praxis-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ../../build/public:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - managed-ai
