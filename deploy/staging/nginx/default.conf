server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /praxis {
    return 302 /praxis/;
  }

  location = /praxis/app {
    return 302 /praxis/app/;
  }

  location /praxis/app/ {
    alias /usr/share/nginx/html/app/;
    try_files $uri $uri/ /praxis/app/index.html;
  }

  location /praxis/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /praxis/index.html;
  }

  location /praxis/praxis-ai/ {
    proxy_pass http://managed-ai:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
