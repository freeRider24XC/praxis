name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 匹配所有以 v 开头的 tag，如 v1.0.0

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Update version in pubspec.yaml
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # 提取主版本号作为 build number
          BUILD_NUMBER=$(echo $VERSION | cut -d'+' -f2)
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER=$(echo $VERSION | cut -d'.' -f1)
          fi
          # 更新 pubspec.yaml 中的版本号
          sed -i "s/^version:.*/version: $VERSION+$BUILD_NUMBER/" pubspec.yaml
          cat pubspec.yaml | grep version
      
      - name: Setup Android keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
            cat >> android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=keystore.jks
          EOF
          fi
      
      - name: Build Android APK
        run: |
          flutter build apk --release
      
      - name: Build Android App Bundle
        run: |
          flutter build appbundle --release
      
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      
      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
      
      - name: Upload APK to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## 版本 ${{ steps.version.outputs.version }}
            
            ### Android
            - APK: 已上传
            - AAB: 已上传
            
            ### iOS
            - IPA: 请查看 iOS 构建任务
            
            ### 更新日志
            请查看 [CHANGELOG.md](../CHANGELOG.md) 了解详细更新内容。
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install
      
      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Update version in pubspec.yaml
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_NUMBER=$(echo $VERSION | cut -d'+' -f2)
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER=$(echo $VERSION | cut -d'.' -f1)
          fi
          sed -i '' "s/^version:.*/version: $VERSION+$BUILD_NUMBER/" pubspec.yaml
          cat pubspec.yaml | grep version
      
      - name: Setup iOS certificates
        if: env.IOS_CERTIFICATE_BASE64 != ''
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -n "$IOS_CERTIFICATE_BASE64" ]; then
            # 创建钥匙串
            security create-keychain -p "" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "" build.keychain
            security set-keychain-settings -t 3600 -u build.keychain
            
            # 导入证书
            echo "$IOS_CERTIFICATE_BASE64" | base64 -d > certificate.p12
            security import certificate.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            
            # 导入配置文件
            if [ -n "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
              echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
            fi
            
            # 设置代码签名
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          fi
      
      - name: Build iOS IPA
        run: |
          flutter build ipa --release
        continue-on-error: true
      
      - name: Upload iOS IPA
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Upload IPA to Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: build/ios/ipa/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-download-links:
    name: Update Download Links
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: always()  # 即使 iOS 构建失败也继续执行
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '**/*'
          merge-multiple: false
          path: artifacts
      
      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || (apt update && apt install curl -y)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg \
          && chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg \
          && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
          && apt update \
          && apt install gh -y
      
      - name: Upload to GitHub Releases
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          # 查找文件
          APK_FILE=$(find artifacts -name "*.apk" | head -1)
          AAB_FILE=$(find artifacts -name "*.aab" | head -1)
          IPA_FILE=$(find artifacts -name "*.ipa" | head -1)
          
          # 上传到 GitHub Releases
          if [ -f "$APK_FILE" ]; then
            gh release upload ${{ github.ref_name }} "$APK_FILE" --clobber
          fi
          if [ -f "$AAB_FILE" ]; then
            gh release upload ${{ github.ref_name }} "$AAB_FILE" --clobber
          fi
          if [ -f "$IPA_FILE" ]; then
            gh release upload ${{ github.ref_name }} "$IPA_FILE" --clobber
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Update version info JSON
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_DATE=$(date +"%Y-%m-%d")
          
          # 创建版本信息 JSON
          TAG_NAME="${{ github.ref_name }}"
          cat > docs/version.json <<EOF
          {
            "version": "$VERSION",
            "releaseDate": "$RELEASE_DATE",
            "android": {
              "apk": "https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/app-release.apk",
              "aab": "https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/app-release.aab"
            },
            "ios": {
              "ipa": "https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/Runner.ipa"
            }
          }
          EOF
          
          cat docs/version.json
      
      - name: Commit and push version info
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/version.json
          git diff --staged --quiet || git commit -m "chore: update version info to ${{ steps.version.outputs.version }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

